name: Release VSIX

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (semver)
        required: true
        type: string
      prerelease:
        description: Mark as a pre-release
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name || format('v{0}', inputs.version) }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish VSIX
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="v${{ inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Create release tag
        id: tag
        shell: bash
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          else
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git tag -a "$TAG" -m "Agendo $TAG"
            git push origin "$TAG"
            echo "Created and pushed tag $TAG"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches extension version
        id: package
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          expected_tag="v${version}"
          release_tag="${{ steps.release.outputs.tag }}"

          if [[ "$release_tag" != "$expected_tag" ]]; then
            echo "Release tag '$release_tag' does not match package version '$version'."
            echo "Expected tag: '$expected_tag'."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "vsix=dist/agendo-${version}.vsix" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Compile, lint, and test
        run: xvfb-run -a npm test

      - name: Package VSIX
        run: |
          mkdir -p dist
          npx --yes @vscode/vsce@3.6.2 package \
            --out "${{ steps.package.outputs.vsix }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: agendo-${{ steps.package.outputs.version }}-vsix
          path: ${{ steps.package.outputs.vsix }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        shell: bash
        run: |
          PRERELEASE_FLAG=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.prerelease }}" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          release_tag="${{ steps.release.outputs.tag }}"

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" "${{ steps.package.outputs.vsix }}" --clobber
            if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.prerelease }}" == "true" ]]; then
              gh release edit "$release_tag" --prerelease
            fi
          else
            gh release create "$release_tag" \
              "${{ steps.package.outputs.vsix }}#Agendo ${{ steps.package.outputs.version }} VSIX" \
              --verify-tag \
              --title "Agendo $release_tag" \
              --generate-notes \
              $PRERELEASE_FLAG
          fi
