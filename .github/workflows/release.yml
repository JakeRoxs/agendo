name: Release VSIX

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (semver). Leave blank to use the current package.json version.
        required: false
        type: string
      prerelease:
        description: Mark the GitHub release as a pre-release
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name || format('v{0}', inputs.version) }}
  cancel-in-progress: false

jobs:
  release:
    name: Agendo ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ -n "$INPUT_VERSION" ]]; then
              TAG="v${INPUT_VERSION}"
            else
              PKG_VERSION=$(node -p "require('./package.json').version")
              echo "No version provided; defaulting to package.json version '$PKG_VERSION'."
              TAG="v${PKG_VERSION}"
            fi
          else
            TAG="$REF_NAME"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches extension version
        id: package
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          expected_tag="v${version}"
          release_tag="${{ steps.release.outputs.tag }}"

          if [[ "$release_tag" != "$expected_tag" ]]; then
            echo "Release tag '$release_tag' does not match package version '$version'."
            echo "Expected tag: '$expected_tag'."
            exit 1
          fi

          if git rev-parse "$release_tag" >/dev/null 2>&1; then
            tag_commit=$(git rev-list -n 1 "$release_tag")
            head_commit=$(git rev-parse HEAD)
            if [[ "$tag_commit" != "$head_commit" ]]; then
              echo "Existing tag '$release_tag' points to $tag_commit, but this run checked out $head_commit."
              echo "Run the workflow from the tagged ref or use a new version."
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "vsix=dist/agendo-${version}.vsix" >> "$GITHUB_OUTPUT"

      - name: Extract changelog notes
        id: notes
        shell: bash
        run: |
          version="${{ steps.package.outputs.version }}"
          notes_file="${RUNNER_TEMP}/release-notes.md"

          # Extract the CHANGELOG section for this version (from its heading to
          # the next version heading). Matches both "## [x.y.z]" and
          # "## [x.y.z] - date" header forms.
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' > "$notes_file"

          if [[ -s "$notes_file" ]]; then
            echo "notes_path=$notes_file" >> "$GITHUB_OUTPUT"
            echo "Using CHANGELOG section for v${version} as release notes."
          else
            echo "No CHANGELOG section for v${version}; falling back to generated notes."
          fi

      - name: Install dependencies
        run: npm ci

      - name: Compile, lint, and test
        run: xvfb-run -a npm test

      - name: Package VSIX
        run: |
          mkdir -p dist
          npx --yes @vscode/vsce@3.6.2 package \
            --out "${{ steps.package.outputs.vsix }}"

      - name: Create release tag
        id: tag
        shell: bash
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git tag -a "$TAG" -m "Agendo $TAG"
            git push origin "$TAG"
            echo "Created and pushed tag $TAG"
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: agendo-${{ steps.package.outputs.version }}-vsix
          path: ${{ steps.package.outputs.vsix }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        shell: bash
        run: |
          PRERELEASE_FLAG=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.prerelease }}" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          release_tag="${{ steps.release.outputs.tag }}"

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" "${{ steps.package.outputs.vsix }}" --clobber
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              gh release edit "$release_tag" --prerelease="${{ inputs.prerelease }}"
            fi
          else
            notes_path="${{ steps.notes.outputs.notes_path }}"
            if [[ -n "$notes_path" && -s "$notes_path" ]]; then
              NOTES_FLAG="--notes-from $notes_path"
            else
              NOTES_FLAG="--generate-notes"
            fi

            gh release create "$release_tag" \
              "${{ steps.package.outputs.vsix }}#Agendo ${{ steps.package.outputs.version }} VSIX" \
              --verify-tag \
              --title "Agendo $release_tag" \
              $NOTES_FLAG \
              $PRERELEASE_FLAG
          fi
