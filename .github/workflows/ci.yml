name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    name: Build, test, and package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Compile, lint, and test
        run: xvfb-run -a npm test

      - name: Upload test results for Sonar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-test-results
          path: reports/test-results.xml
          if-no-files-found: error
          retention-days: 14

      - name: Read extension version
        id: package
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Package VSIX
        run: |
          mkdir -p dist
          npx --yes @vscode/vsce@3.6.2 package \
            --out "dist/agendo-${{ steps.package.outputs.version }}.vsix"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: agendo-${{ steps.package.outputs.version }}-vsix
          path: dist/*.vsix
          if-no-files-found: error
          retention-days: 14

  sonar-analysis:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    needs: build-test-package

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: sonar-test-results
          path: reports

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
