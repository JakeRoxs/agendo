  <path d="M189 59 Q207 30 238 40 Q262 43 279 68 L317 120 Q330 138 320 166 L166 455 Q157 474 140 474 H42 Q15 474 27 443 Z" fill="url(#page)"/>
  <!-- Curled document top. -->
