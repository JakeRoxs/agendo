<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Agendo icon">
 <defs>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#30f4e6"/><stop offset=".46" stop-color="#05b8ec"/><stop offset="1" stop-color="#2368ee"/></linearGradient>
  <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset=".65" stop-color="#e6f7ff"/><stop offset="1" stop-color="#8fc5ff"/></linearGradient>
  <linearGradient id="board" x1="0" x2=".8" y1="0" y2="1"><stop stop-color="#09235d"/><stop offset="1" stop-color="#061337"/></linearGradient>
  <linearGradient id="card" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#04c8f3"/><stop offset="1" stop-color="#1768d6"/></linearGradient>
