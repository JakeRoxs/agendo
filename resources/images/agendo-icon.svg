  <linearGradient id="fold" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#ffffff"/><stop offset=".6" stop-color="#e6f6ff"/><stop offset="1" stop-color="#71b6ef"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#001739" flood-opacity=".2"/></filter>
